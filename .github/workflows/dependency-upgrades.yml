# Weekly dependency upgrades: runs dep-agent and opens a PR with every upgrade that passed the tests.
# Put this file at  .github/workflows/dependency-upgrades.yml  in the project you want upgraded.
name: dependency-upgrades

on:
  schedule:
    - cron: "30 3 * * 1"        # every Monday 03:30 UTC = 09:00 IST
  workflow_dispatch:             # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write                # push the upgrade branch
  pull-requests: write           # open the PR

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project's dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Install dep-agent (from your own GitHub account)
        run: pip install "git+https://github.com/${{ github.repository_owner }}/dep-upgrade-agent"

      - name: Configure git
        run: |
          git config user.name  "dep-agent[bot]"
          git config user.email "dep-agent@users.noreply.github.com"

      - name: Run the agent
        run: |
          set +e
          dep-agent .
          code=$?
          # 0 = all good, 1 = some installs failed (still worth a PR); anything else is a real error
          if [ $code -gt 1 ]; then exit $code; fi

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="${{ github.event.repository.default_branch }}"
          if [ "$(git rev-list --count origin/$BASE..HEAD)" -eq 0 ]; then
            echo "Nothing was upgraded - no PR needed."
            exit 0
          fi
          BRANCH=$(git branch --show-current)
          git push -u origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "Dependency upgrades $(date +%Y-%m-%d)" \
            --body-file .dep-agent/upgrade-report.md
